@if (data() || url()) {
  <img class="avatar" [src]="data() || url()" [width]="avatarWidth()" [height]="avatarHeight()"/>
}
@if (!data() && !url()) {
  <mat-icon class="icon" [style.font-size.px]="avatarWidth()" [style.width.px]="avatarWidth()" [style.height.px]="avatarHeight()">account_circle</mat-icon>
}
