<mat-card matRipple [matRippleTrigger]="ripple">
  <mat-card-content class="item" (click)="viewUser()" (mousedown)="onRipple()">
    <div class="item-header">
      <div class="item-thumbnail">
        <user-avatar [user]="user" avatarWidth="40" avatarHeight="40"></user-avatar>
      </div>

      <div class="item-header-content">
        <div class="item-title">
          <span>{{ user?.displayName }}</span>
        </div>

        @if (location?.properties?.timestamp) {
          <div class="item-subtitle">
            {{ location?.properties?.timestamp | moment }}
          </div>
        }

        @if (location?.geometry) {
          <div class="item-subtitle">
            {{ location?.geometry | geometry : 5 }}
          </div>
        }
      </div>

      @if (user?.iconUrl) {
        <div>
        <img class="item-icon" [src]="user?.iconUrl + '?access_token=' + token" alt="" />
      </div>
}
    </div>
  </mat-card-content>

  <mat-card-actions>
    <div class="actions-buttons">
      @if (followingUser.id !== user?.id) {
<button matButton (click)="followUser($event)">Follow</button>
}
      @if (followingUser.id === user?.id) {
<button matButton="filled" (click)="followUser($event)">Following</button>
}
    </div>

    <div class="actions-icons">
      <button matIconButton (click)="onUserLocation()">
        <mat-icon>my_location</mat-icon>
      </button>
    </div>
  </mat-card-actions>

  <div #ripple></div>
</mat-card>
