<mat-toolbar>
  <button matIconButton (click)="close()">
    <mat-icon>arrow_back</mat-icon>
  </button>

  @if (primary) {
    <span class="title">{{ primary }}</span>
  }
</mat-toolbar>

<div class="feed-item">
  <mat-card class="feed-item__card">
    <div class="card-header">
      <div class="card-header-text">
        @if (date) {
          <div class="card-overline">{{ date }}</div>
        }
        @if (primary) {
          <div class="card-title">{{ primary }}</div>
        }
        @if (secondary) {
          <div class="card-subtitle">{{ secondary }}</div>
        }
      </div>

      <div class="card-avatar">
        <feed-icon [icon]="feed.icon" [active]="true"></feed-icon>
      </div>
    </div>

    <div class="card-image">
      <map-clip class="map" [feature]="mapFeature"></map-clip>
    </div>

    <div class="card-actions">
      <button matButton (click)="onLocationClick()">
        <mat-icon>gps_fixed</mat-icon>
        <span>{{ item?.geometry | geometry:5 }}</span>
      </button>
    </div>
  </mat-card>

  <mat-card class="feed-item__card">
    <mat-card-header>
      <mat-card-title>Properties</mat-card-title>
    </mat-card-header>

    <mat-list>
      @for (property of properties; track property) {
        <mat-list-item>
          <span matListItemTitle class="prop-key">{{ property.key }}</span>
          <span matListItemLine class="prop-value">{{ property.value }}</span>
        </mat-list-item>
      }
    </mat-list>
  </mat-card>
</div>
