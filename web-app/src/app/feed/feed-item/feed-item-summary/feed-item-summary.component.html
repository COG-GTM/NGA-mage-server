<mat-card matRipple [matRippleTrigger]="ripple">
  <mat-card-content class="item" (click)="onItemSelect()" (mousedown)="onRipple()">
    <div class="item-header">
      <div class="item__icon">
        @if (!feed.mapStyle?.icon) {
          <mat-icon>place</mat-icon>
        }
        @if (feed.mapStyle?.icon) {
          <mage-static-icon-img [iconRef]="feed.mapStyle.icon" [accessToken]="accessToken"></mage-static-icon-img>
        }
      </div>

      <div class="item__content">
        @if (hasContent) {
          @if (timestamp) {
            <span class="item__timestamp">{{timestamp | moment}}</span>
          }
          <span class="item__primary">{{primary || "&nbsp;"}}</span>
          <span class="item__secondary">{{secondary || "&nbsp;"}}</span>
        } @else {
          <span class="item__primary">{{feed.title}}</span>
        }
      </div>
    </div>
  </mat-card-content>

  <div #ripple></div>
</mat-card>
