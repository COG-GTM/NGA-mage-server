<div [hidden]="!attachments.length">
  <div class="title">{{field?.title}}</div>

  @if (attachments.length) {
    <mat-grid-list class="edit-attachments__grid" cols="2" rowHeight="210px" gutterSize="4px">
      @for (attachment of attachments; track attachment; let isFirst = $first) {
        <mat-grid-tile [rowspan]="1" [colspan]="isFirst && (attachments.length % 2 === 1) ? 2 : 1">
          <observation-attachment [attachment]="attachment" clickable="true"></observation-attachment>
        </mat-grid-tile>
      }
    </mat-grid-list>
  }
</div>
