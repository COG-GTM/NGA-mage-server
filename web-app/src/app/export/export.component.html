<div class="export">
  @if (state.view === viewState.List && state.count > 0) {
    <div class="export-content" [@fade]>
      <export-list (create)="onCreate()"></export-list>
    </div>
  }

  @if (state.view === viewState.List && state.count === 0) {
    <div class="export-content" [@fade]>
      <export-empty (open)="onCreate()"></export-empty>
    </div>
  }

  @if (state.view === viewState.Create) {
    <div class="export-content" [@fade]>
      <export-create (close)="onCreateClose()"></export-create>
    </div>
  }
</div>
