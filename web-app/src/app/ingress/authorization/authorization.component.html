<div class="authorization" [class.compact]="compact">
  <div class="header">
    @if (!compact) {
      <div class="header__title">Access Code</div>
    }
    <div class="header__message">Please enter your Mage access code. If you do not have an access code please ask you Mage
    administrator to provide you with one.</div>
  </div>

  <div class="content">
    <mat-form-field appearance="fill">
      <mat-label>Access Code</mat-label>
      <input matInput placeholder="Access Code" type="deviceId" [formControl]="deviceId" (keydown.enter)="authorize()" required>
      @if (deviceId.hasError('invalid')) {
        <mat-error>Invalid access code</mat-error>
      }
    </mat-form-field>
  </div>

  <div class="authorize">
    <button matButton="filled" (click)="authorize()">Continue to Mage</button>
  </div>
</div>
